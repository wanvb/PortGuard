[package]
name = "portguard-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
portguard-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    # 提升权限检查：OpenProcessToken / GetTokenInformation(TokenElevation)
    "Win32_Security",
    # OpenProcessToken / CreateMutexW / GetCurrentProcess
    "Win32_System_Threading",
    # GetModuleHandleW（注册窗口类所需的实例句柄）
    "Win32_System_LibraryLoader",
    # GetTimeZoneInformation（日志时间戳使用本地时区）
    "Win32_System_Time",
    # 托盘：Shell_NotifyIconW / ShellExecuteW
    "Win32_UI_Shell",
    # 隐藏窗口、消息循环、弹出菜单、图标
    "Win32_UI_WindowsAndMessaging",
    # WNDCLASSW 的背景画刷字段来自 Gdi
    "Win32_Graphics_Gdi",
    # 控制台：SetConsoleCtrlHandler / SetConsoleOutputCP
    "Win32_System_Console",
] }
